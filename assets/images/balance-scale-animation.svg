<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated illustration of a balance scale titled Fair Reward for Fair Contribution, tipping into balance between a pan of data contributions and a pan holding a reward token" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .beam-group {
      transform-box: view-box;
      transform-origin: 250px 140px;
      animation: settle 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 sway 4.5s ease-in-out 1.2s infinite;
    }
    @keyframes settle {
      from { transform: rotate(-10deg); }
      to   { transform: rotate(0deg); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-2deg); }
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      fill: #1B2A4A;
      text-anchor: middle;
    }
    .pan-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #1F2933;
      text-anchor: middle;
    }
    @media (prefers-reduced-motion: reduce) {
      .beam-group { animation: none; }
    }
  </style>

  <text class="title" x="250" y="28">Fair Reward for Fair Contribution</text>

  <polygon points="220,262 280,262 250,232" fill="#1B2A4A"/>
  <rect x="246" y="140" width="8" height="92" fill="#1B2A4A"/>

  <g class="beam-group">
    <line x1="140" y1="140" x2="360" y2="140" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="250" cy="140" r="7" fill="#1B2A4A"/>

    <line x1="140" y1="140" x2="140" y2="185" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="140" cy="192" rx="46" ry="14" fill="none" stroke="#0F9E8E" stroke-width="4"/>
    <rect x="118" y="176" width="26" height="18" rx="3" fill="#3DBBAB"/>
    <rect x="132" y="170" width="26" height="18" rx="3" fill="#0F9E8E"/>

    <line x1="360" y1="140" x2="360" y2="185" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="360" cy="192" rx="46" ry="14" fill="none" stroke="#F0932B" stroke-width="4"/>
    <path d="M360,170 l6,13 14,2 -10,10 2,14 -12,-7 -12,7 2,-14 -10,-10 14,-2 z" fill="#FBBF4A"/>
  </g>

  <text class="pan-label" x="140" y="222">Contribution</text>
  <text class="pan-label" x="360" y="222">Incentive</text>
</svg>
