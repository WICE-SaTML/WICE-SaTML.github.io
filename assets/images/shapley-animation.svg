<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated illustration of four contributors' values flowing into a shared coalition value, representing the intuition behind the Shapley value" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .link {
      stroke: #C9D3DC;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 6 10;
      animation: flow 3.2s linear infinite;
    }
    .link.d2 { animation-delay: 0.8s; }
    .link.d3 { animation-delay: 1.6s; }
    .link.d4 { animation-delay: 2.4s; }
    @keyframes flow {
      to { stroke-dashoffset: -160; }
    }
    .hub {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 3.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      fill: #1F2933;
      text-anchor: middle;
    }
    .hub-label { fill: #ffffff; font-weight: 600; }
    @media (prefers-reduced-motion: reduce) {
      .link, .hub { animation: none; }
    }
  </style>

  <line class="link"    x1="80"  y1="60"  x2="240" y2="150"/>
  <line class="link d2" x1="400" y1="60"  x2="240" y2="150"/>
  <line class="link d3" x1="80"  y1="240" x2="240" y2="150"/>
  <line class="link d4" x1="400" y1="240" x2="240" y2="150"/>

  <circle cx="80"  cy="60"  r="26" fill="#0F9E8E"/>
  <text class="label" x="80"  y="60"  dominant-baseline="central">P1</text>

  <circle cx="400" cy="60"  r="26" fill="#3DBBAB"/>
  <text class="label" x="400" y="60"  dominant-baseline="central">P2</text>

  <circle cx="80"  cy="240" r="26" fill="#6FD0C2"/>
  <text class="label" x="80"  y="240" dominant-baseline="central">P3</text>

  <circle cx="400" cy="240" r="26" fill="#A6E4DA"/>
  <text class="label" x="400" y="240" dominant-baseline="central">P4</text>

  <circle class="hub" cx="240" cy="150" r="34" fill="#1B2A4A"/>
  <text class="label hub-label" x="240" y="150" dominant-baseline="central">v(S)</text>
</svg>
