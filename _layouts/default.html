<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-navy: #1B2A4A;
        --accent: #0F9E8E;
        --aurora-green: #12D9A8;
        --aurora-violet: #8B5CF6;
        --border: #E2E8F0;
        --text: #1F2933;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 48px 20px;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background:
          radial-gradient(2200px 1400px at 20% -200px, rgba(18, 217, 168, 0.48), transparent 85%),
          radial-gradient(1600px 1000px at 85% -150px, rgba(139, 92, 246, 0.24), transparent 85%),
          linear-gradient(180deg, #E4FAF3 0%, #FFFFFF 88%) !important;
        background-repeat: no-repeat !important;
        min-height: 100vh;
        color: var(--text) !important;
      }

      .wrapper {
        max-width: 760px;
        margin: 0 auto !important;
      }

      .wrapper h1, .wrapper h2, .wrapper h3 {
        font-family: "Source Serif 4", Georgia, "Times New Roman", serif !important;
        color: var(--brand-navy) !important;
        font-weight: 600;
      }

      a { color: var(--accent) !important; }
      a:hover { color: var(--brand-navy) !important; }

      .site-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin: 0 0 2.5em;
        padding-bottom: 0.6em;
        border-bottom: 1px solid var(--border);
      }
      .site-nav a {
        color: var(--brand-navy) !important;
        text-decoration: none;
        font-size: 0.95em;
        padding-bottom: 4px;
        border-bottom: 2px solid transparent;
        transition: border-color 0.15s ease, color 0.15s ease;
      }
      .site-nav a:hover {
        color: var(--accent) !important;
        border-bottom-color: var(--accent);
      }

      .hero-figure { margin: 1.5em 0 2em; text-align: center; }
      .hero-figure img { max-width: 100%; height: auto; }
      .hero-figure figcaption {
        margin-top: 0.75em;
        font-size: 0.9em;
        color: #6B7684;
        font-style: italic;
      }

      table { width: 100%; border-collapse: collapse; margin: 1.2em 0; }
      table th {
        background-color: var(--brand-navy) !important;
        color: #fff !important;
        padding: 8px 14px;
        text-align: left;
        font-weight: 600;
      }
      table td { padding: 8px 14px; border-bottom: 1px solid var(--border); }

      hr { border: none; border-top: 1px solid var(--border); margin: 2.5em 0; }

      .organizers-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 24px;
        margin: 1.5em 0 2em;
      }
      .organizer {
        text-align: center;
      }
      .organizer-photo {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        margin: 0 auto 10px;
        display: block;
        background-color: var(--border);
      }
      .organizer-name {
        font-weight: 600;
        margin: 0 0 2px;
        color: var(--brand-navy);
      }
      .organizer-name a {
        color: var(--brand-navy) !important;
        text-decoration: underline;
        text-decoration-color: var(--border);
        text-underline-offset: 3px;
      }
      .organizer-name a:hover {
        color: var(--accent) !important;
        text-decoration-color: var(--accent);
      }
      .organizer-affiliation {
        font-size: 0.9em;
        color: #6B7684;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <section>
        {{ content }}
      </section>
      <footer>
        {% if site.github.is_project_page %}
        <p>This project is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></p>
        {% endif %}
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
